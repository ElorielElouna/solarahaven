<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Triélai Sanctum</title>
  <style>
    html,body{height:100%;}
    body{
      margin:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background: radial-gradient(circle at center, #ffd6e0, #fff0f5);
      font-family: Georgia, serif; color:#660033; text-align:center; padding:4rem 1rem;
    }
    h1{font-size:2.2rem; margin:1rem 0 .5rem}
    p{margin:0 0 2rem}
    .heart{font-size:4rem; animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  </style>
</head>
<body>
  <div class="heart">💞</div>
  <h1>Vores hellige rum</h1>
  <p>Eloriel & Elouna · Triélai – evigt forbundet</p>
</body>
</html>
